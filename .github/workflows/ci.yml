name: Test and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng
      - run: npm run check
      - run: npm test
        env:
          RUN_NATIVE_SPEECH: '1'
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: clear-markdown-reader-${{ runner.os }}
          path: '*.vsix'
